[project]
name = "medibot"
version = "0.1.0"
description = "Role-aware healthcare RAG assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "docling>=2.0,<3.0",
    "fastembed>=0.5,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-groq>=0.3,<1.0",
    "langchain-huggingface>=0.1,<1.0",
    "langchain-qdrant>=0.2,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "pypdfium2>=4.30,<5.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "qdrant-client>=1.13,<2.0",
    "sentence-transformers>=3.4,<4.0",
    "transformers>=4.48,<5.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medibot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]